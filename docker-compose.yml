services:
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand({ ping: 1 }).ok' | mongosh localhost:27017/test --quiet | grep 1 >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8002:8002"
    env_file:
      - .env.docker
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGODB_URI: mongodb://mongo:27017
      DATABASE_URL: mongodb://mongo:27017
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:3001:80"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8002
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
