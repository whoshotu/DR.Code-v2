name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'doprax'
        type: choice
        options:
          - doprax
          - koyeb
          - render

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/drcode-backend:${{ github.sha }}
      
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/drcode-frontend:${{ github.sha }}
        env:
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}

      - name: Deploy to Doprax
        if: github.event.inputs.environment == 'doprax'
        run: |
          echo "Deploying to Doprax..."
          # Add Doprax CLI deployment commands here
          # doprax deploy --image ${{ secrets.DOCKER_USERNAME }}/drcode-backend:${{ github.sha }}
      
      - name: Deploy to Koyeb
        if: github.event.inputs.environment == 'koyeb'
        run: |
          echo "Deploying to Koyeb..."
          # Add Koyeb CLI deployment commands here
      
      - name: Deploy to Render
        if: github.event.inputs.environment == 'render'
        run: |
          echo "Deploying to Render..."
          # Add Render CLI deployment commands here
