name: Test

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Run backend tests
        run: |
          cd backend
          pytest tests/test_github_webhook_regression.py -v
        env:
          REACT_APP_BACKEND_URL: http://localhost:8002
          MONGO_URL: ${{ secrets.MONGO_URL }}
          DB_NAME: drcode
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_MODEL: llama3.1:8b
          CORS_ORIGINS: http://localhost:3001
          SECRET_KEY: test-secret-key-for-ci

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm install
      
      - name: Run frontend build check
        run: |
          cd frontend
          npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install linting tools
        run: |
          pip install black flake8 isort
      
      - name: Run black
        run: |
          cd backend
          black --check .
      
      - name: Run isort
        run: |
          cd backend
          isort --check-only .
      
      - name: Run flake8
        run: |
          cd backend
          flake8 .
